<!DOCTYPE html>
<html lang="sr-Latn" translate="no">

<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C5JCE202MQ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-C5JCE202MQ');
    </script>

    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Stranica nije pronađena — Pomoć na fonu</title>

    <link rel="icon" href="/images/favicon.ico?v=2" sizes="48x48">
    <link rel="icon" href="/images/favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" href="/images/favicon-96.png?v=2" sizes="96x96" type="image/png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/index_files/tokens.css">
    <style>
        /* Boje i fontovi dolaze iz /index_files/tokens.css */

        *, *::before, *::after { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(700px 450px at 15% 0%, rgba(255, 176, 32, 0.14), transparent 70%),
                radial-gradient(600px 450px at 100% 100%, rgba(255, 141, 58, 0.09), transparent 70%),
                var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 6px; }

        header { padding: 28px 32px; }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.05rem;
        }

        .logo img { height: 34px; width: auto; }

        main {
            flex: 1;
            display: grid;
            place-items: center;
            min-height: 0;
            padding: 16px 24px 48px;
            text-align: center;
        }

        .code {
            margin: 0;
            font-size: clamp(6rem, 22vw, 11rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.06em;
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            margin: 12px 0 10px;
            font-size: clamp(1.5rem, 4vw, 2rem);
            letter-spacing: -0.02em;
        }

        .sub {
            margin: 0 auto 32px;
            max-width: 440px;
            color: var(--text-2);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 48px;
            padding: 0 22px;
            border-radius: var(--r-md);
            font-weight: 700;
            transition: transform .15s ease, border-color .15s ease, background .15s ease;
        }

        .btn:hover { transform: translateY(-1px); }

        .btn-primary { background: var(--grad); color: var(--on-accent); box-shadow: var(--shadow-cta); }
        .btn:active { transform: scale(0.98); }

        .btn-ghost {
            border: 1px solid var(--line-strong);
            background: var(--surface);
        }

        .btn-ghost:hover { border-color: rgba(255, 176, 32, 0.45); }

        .help {
            margin-top: 36px;
            font-size: 0.9rem;
            color: var(--text-3);
        }

        .help a { color: var(--amber); font-weight: 600; }
        .help a:hover { text-decoration: underline; }

        @media (max-height: 600px) {
            header { padding: 16px 24px; }
            main { padding-bottom: 16px; }
            .code { font-size: clamp(4rem, 18vh, 7rem); }
            h1 { margin: 6px 0; }
            .sub { margin-bottom: 18px; }
            .help { margin-top: 18px; }
        }
    </style>
</head>

<body>
    <header>
        <a href="/" class="logo" aria-label="Pomoć na fonu — početna"><img src="/images/pomoc-na-fonu-znak.svg" alt="" width="34" height="34"><span>Pomoć na <span class="brand-accent">fonu</span></span></a>
    </header>

    <main>
        <div>
            <p class="code" aria-hidden="true">404</p>
            <h1>Stranica nije pronađena</h1>
            <p class="sub">Stranica koju tražiš ne postoji ili je premeštena. Proveri adresu ili se vrati na početnu.</p>

            <div class="actions">
                <a href="/" class="btn btn-primary"><i class="fas fa-house"></i> Početna</a>
                <a href="/kursevi/" class="btn btn-ghost"><i class="fas fa-book-open"></i> Kursevi</a>
            </div>

            <p class="help">Misliš da je greška? Javi nam se na
                <a href="https://wa.me/381659752402" target="_blank" rel="noopener">WhatsApp</a> ili
                <a href="mailto:pomocnafonu@gmail.com">pomocnafonu@gmail.com</a>.
            </p>
        </div>
    </main>
</body>

</html>
