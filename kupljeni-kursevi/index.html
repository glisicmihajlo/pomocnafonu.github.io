    h2 {
      font-size: 2.2rem;
      font-weight: 600;
      color: #ecf0f1;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .logout-btn {
      background: linear-gradient(135deg, #2f2f2f, #121212); /* Tamni sivo-crni gradijent */
      border: none;
      color: white;
      padding: 0.8rem 1.6rem;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      position: absolute;
      top: 20px;
      right: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      width: auto; /* Prilagodljiva širina */
    }

    .logout-btn:hover {
      background: linear-gradient(135deg, #121212, #2f2f2f); /* Invertovani gradijent na hover */
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .course-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 2rem;
      width: 90%;
      max-width: 1200px;
      margin-top: 2rem;
    }

    .course-card {
      background: #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
      padding: 1.5rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
      text-align: center;
      justify-content: flex-start;
    }

    .course-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .course-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 1rem;
      transition: all 0.3s ease;
    }

    .course-card:hover img {
      transform: scale(1.05);
    }

    .course-card h3 {
      font-size: 1.3rem;
      font-weight: 500;
      color: #ecf0f1;
      margin-bottom: 1rem;
      text-transform: capitalize;
    }

    .course-card p {
      font-size: 1rem;
      color: #bdc3c7;
    }

    #emptyMsg {
      color: #7f8c8d;
      font-size: 1.2rem;
      text-align: center;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {

      h2 {
        font-size: 1.8rem;
      }


      .course-list {
        width: 95%;
      }
    }

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
            import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
            import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
            
            // Firebase konfiguracija
            const firebaseConfig = {
              apiKey: "AIzaSyCacNqpdT5RARz4gvtmwewULR2Xv-tqv6c",
              authDomain: "pomoc-na-fonu.firebaseapp.com",
              projectId: "pomoc-na-fonu",
              storageBucket: "pomoc-na-fonu.appspot.com",
              messagingSenderId: "947001381183",
              appId: "1:947001381183:web:11a68f03a52c6ebb2a038a",
              measurementId: "G-768582D9M9"
            };
            
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            
            const courseList = document.getElementById("courseList");
            const emptyMsg = document.getElementById("emptyMsg");
            const link = document.getElementById("kupljeniKurseviLink");
            const authBtn = document.getElementById("authBtn");
            const authBtnText = document.getElementById("authBtnText");
            
            link.style.display = "none";
            
            function generateSessionToken() {
              return Math.random().toString(36).substring(2) + Date.now().toString(36);
            }
            
            async function setupMaxTwoDevices(user) {
                    const userRef = doc(db, "users", user.uid);
                    
                    let sessionToken = localStorage.getItem("sessionToken");
                    if (!sessionToken) {
                        sessionToken = generateSessionToken();
                        localStorage.setItem("sessionToken", sessionToken);
                    }

                    const snap = await getDoc(userRef);
                    let sessionTokens = [];

                    if (snap.exists() && Array.isArray(snap.data().sessionTokens)) {
                        sessionTokens = snap.data().sessionTokens;
                    }

                    // Ako token već postoji (reload stranice)
                    if (sessionTokens.includes(sessionToken)) {
                        return;
                    }

                    // Ako ima već 2 uređaja → zabrani
                    if (sessionTokens.length >= 2) {
                        alert("Dostignut je maksimalan broj uređaja za ovaj nalog (2). Javite se putem mejla pomocnafonu@gmail.com za sva dodatna pitanja.");
                        await signOut(auth);
                        window.location.href = "/login";
                        return;
                    }

                    // Dodaj novi uređaj
                    sessionTokens.push(sessionToken);

                    await setDoc(userRef, { sessionTokens }, { merge: true });

                    // Slušaj promene – ako ti ručno ukloniš token
                    onSnapshot(userRef, (docSnap) => {
                        const data = docSnap.data();
                        if (!data || !Array.isArray(data.sessionTokens)) return;

                        if (!data.sessionTokens.includes(sessionToken)) {
                        alert("Pristup ovom uređaju je uklonjen.");
                        signOut(auth);
                        window.location.href = "/login";
                        }
                    });
                }
            
            // Dugme za prijavu/odjavu
            authBtn.addEventListener("click", async () => {
              if (auth.currentUser) {
                await signOut(auth);
                window.location.href = "/login";
              } else {
                window.location.href = "/login";
              }
            });
            
            // Praćenje stanja ulogovanosti
            onAuthStateChanged(auth, async (user) => {
              if (!user) {
                // Ako korisnik nije ulogovan → odmah na login
                window.location.href = "/login";
                return;
              }
            
              // Ako jeste ulogovan
              link.style.display = "flex";
              authBtnText.textContent = "ODJAVI SE";
              authBtn.href = "javascript:void(0)";
            
              const token = await setupMaxTwoDevices(user);
            
              // Prikaz kupljenih kurseva
              const userRef = doc(db, "users", user.uid);
              const userSnap = await getDoc(userRef);
              if (userSnap.exists()) {
                const data = userSnap.data();
                const kursevi = data.kursevi || [];
                if (kursevi.length === 0) {
                  emptyMsg.textContent = "Nemaš nijedan kupljeni kurs još uvek.";
                  emptyMsg.style.display = "block";
                  return;
                }
            
                const courseNames = {
                  "oikt-klk1": { name: "OIKT - Prvi kolokvijum", img: "prog1.jpg" },
                  "mat1-klk1": { name: "Matematika 1 - Prvi kolokvijum", img: "mat1.jpg" },
                  "mat1-klk2": { name: "Matematika 1 - Drugi kolokvijum", img: "mat1-klk2.png" },
                };
            
                kursevi.forEach(kursId => {
                  const card = document.createElement("div");
                  card.className = "course-card";
                  const course = courseNames[kursId] || { name: kursId, img: "" };
                  card.innerHTML = `
                    <img src="../images/${course.img}" alt="${course.name}" />
                    <h3>${course.name}</h3>
                  `;
                  card.addEventListener("click", () => {
                    window.location.href = "/" + kursId + "-player";
                  });
                  courseList.appendChild(card);
                });
                emptyMsg.style.display = 'none';
              } else {
                emptyMsg.textContent = "Greška: korisnik nije pronađen u bazi.";
                emptyMsg.style.display = 'block';
              }
            });
            
            // Logout dugme na player stranici
            document.getElementById("logoutBtn")?.addEventListener("click", async () => {
              await signOut(auth);
              window.location.href = "/login";
            });
            </script>
