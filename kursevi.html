<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kursevi | Pomoć na FON-u</title>
</head>
<body>
  <h2>Dobrodošao na kurs!</h2>
  <div id="videoContainer">
    <!-- Ovde će se ubaciti VdoCipher video -->
  </div>

  <button id="logoutBtn">Odjavi se</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    // Tvoj Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCacNqpdT5RARz4gvtmwewULR2Xv-tqv6c",
      authDomain: "pomoc-na-fonu.firebaseapp.com",
      projectId: "pomoc-na-fonu",
      storageBucket: "pomoc-na-fonu.firebasestorage.app",
      messagingSenderId: "947001381183",
      appId: "1:947001381183:web:11a68f03a52c6ebb2a038a",
      measurementId: "G-768582D9M9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Provera da li je korisnik ulogovan
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html"; // nije ulogovan
        return;
      }

      // Poziva tvoj backend da dobije OTP + playbackInfo za VdoCipher
      const videoId = "f52a21250cb44ed990a0ecd9c910ca0b"; 

try {
  const res = await fetch(`https://pomocnafonu.vercel.app/api/get_otp?videoId=${videoId}`)


  if (!res.ok) throw new Error("Neuspešan fetch");

  const data = await res.json();

  const iframe = document.createElement("iframe");
  iframe.src = `https://player.vdocipher.com/v2/?otp=${data.otp}&playbackInfo=${data.playbackInfo}`;
  iframe.allowFullscreen = true;
  iframe.allow = "autoplay; encrypted-media";
  iframe.style.border = "0";
  iframe.style.width = "100%";
  iframe.style.height = "480px";

  document.getElementById("videoContainer").appendChild(iframe);

} catch (err) {
  console.error("Greška pri učitavanju videa:", err);
  alert("Došlo je do greške pri učitavanju videa.");
}


    });

    // Logout dugme
    document.getElementById('logoutBtn').addEventListener('click', () => {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    });
  </script>
</body>
</html>
