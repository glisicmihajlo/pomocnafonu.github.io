<!DOCTYPE html>
<html lang="sr">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava - Pomoć na Fonu</title>
  <style>
    /* Reset i osnovni stilovi */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #121212;
      color: #fff;
    }

    /* Kontejner forme */
    .login-container {
      background: #1e1e1e;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      transition: all 0.3s ease;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      color: #f5f5f5;
    }

    /* Input polja */
    .login-container input[type="email"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 20px;
      border: none;
      border-radius: 8px;
      background: #2c2c2c;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: background 0.3s;
    }

    .login-container input[type="email"]::placeholder,
    .login-container input[type="password"]::placeholder {
      color: #aaa;
    }

    .login-container input:focus {
      background: #3a3a3a;
    }

    /* Dugme */
    .login-container button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-container button:hover {
      background: #357ab8;
    }

    /* Linkovi */
    .login-container .links {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .login-container .links a {
      color: #4a90e2;
      text-decoration: none;
      transition: color 0.3s;
    }

    .login-container .links a:hover {
      color: #357ab8;
    }

    .login-container p {
      padding-top: 0.5rem;
    }

    /* Responzivnost */
    @media (max-width: 500px) {
      .login-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Prijava na nalog</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Lozinka">
      <button id="loginBtn">Prijavi se</button>
    <div class="links">
        <p><a href="#" id="forgotPass">Zaboravio si lozinku?</a></p>
        <p id="errorMsg"></p>
        <p>Nemaš nalog? <a href="/register">Registruj se</a></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCacNqpdT5RARz4gvtmwewULR2Xv-tqv6c",
      authDomain: "pomoc-na-fonu.firebaseapp.com",
      projectId: "pomoc-na-fonu",
      storageBucket: "pomoc-na-fonu.appspot.com",
      messagingSenderId: "947001381183",
      appId: "1:947001381183:web:11a68f03a52c6ebb2a038a",
      measurementId: "G-768582D9M9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginBtn = document.getElementById("loginBtn");
    const forgotPass = document.getElementById("forgotPass");
    const errorMsg = document.getElementById("errorMsg");

    // LOGIN
    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      errorMsg.style.color = "red";
      errorMsg.textContent = "";

      if (!email || !password) {
        errorMsg.textContent = "Popuni oba polja!";
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "/kursevi/";
      } catch (err) {
        console.log(err);

        if (err.code === "auth/user-not-found") {
          errorMsg.textContent = "Korisnik sa tim email-om ne postoji.";
        } else if (err.code === "auth/wrong-password") {
          errorMsg.textContent = "Pogrešna lozinka.";
        } else if (err.code === "auth/invalid-email") {
          errorMsg.textContent = "Unet je nevalidan email.";
        } else {
          errorMsg.textContent = "Došlo je do greške. Pokušaj ponovo.";
        }
      }
    });

    // RESET LOZINKE
    forgotPass.addEventListener("click", async () => {
      const email = document.getElementById("email").value;

      errorMsg.style.color = "red";
      errorMsg.textContent = "";

      if (!email) {
        errorMsg.textContent = "Unesi email da bi resetovao lozinku.";
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        errorMsg.style.color = "lightgreen";
        errorMsg.textContent = "Poslat je email za reset lozinke.";
      } catch (err) {
        console.log(err);

        if (err.code === "auth/user-not-found") {
          errorMsg.textContent = "Nalog sa ovim email-om ne postoji.";
        } else if (err.code === "auth/invalid-email") {
          errorMsg.textContent = "Email nije validan.";
        } else {
          errorMsg.textContent = "Došlo je do greške. Pokušaj ponovo.";
        }
      }
    });
  </script>

</body>
</html>
