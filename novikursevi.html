<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <title>Moj kurs</title>

  <!-- Firebase JS SDK - COMPAT verzije -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-functions-compat.js"></script>

  <!-- VdoCipher player -->
  <script src="https://player.vdocipher.com/playerAssets/1.6.10/vdo.js"></script>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #vdo-player { width: 100%; max-width: 800px; margin-top: 20px; height: 360px; }
    button { padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>

<h1>Moj zaštićeni video kurs</h1>
<button id="play-btn">Pogledaj video</button>
<div id="vdo-player"></div>

<script>
  // 1️⃣ Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCacNqpdT5RARz4gvtmwewULR2Xv-tqv6c",
    authDomain: "pomoc-na-fonu.firebaseapp.com",
    projectId: "pomoc-na-fonu",
    storageBucket: "pomoc-na-fonu.firebasestorage.app",
    messagingSenderId: "947001381183",
    appId: "1:947001381183:web:11a68f03a52c6ebb2a038a",
    measurementId: "G-768582D9M9"
  };

  // 2️⃣ Inicijalizacija Firebase-a
  const app = firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const functions = firebase.app().functions("us-central1"); // region gde je funkcija deploy-ovana

  // 3️⃣ Login test korisnika
  async function loginTestUser() {
    try {
      const userCredential = await auth.signInWithEmailAndPassword("test@kurs.com", "lozinka123");
      console.log("Korisnik prijavljen:", userCredential.user.email);
      return userCredential.user;
    } catch (err) {
      console.error("Login failed:", err);
      alert("Login failed. Proveri email i lozinku.");
      return null;
    }
  }

  // 4️⃣ Pozivanje Firebase funkcije za token
  async function getToken(videoId) {
    const getPlaybackToken = functions.httpsCallable("getPlaybackToken");
    try {
      const result = await getPlaybackToken({ videoId });
      if (!result.data || !result.data.otp || !result.data.playbackInfo) {
        alert("Ne mogu da dobijem token za video. Proveri videoId i region funkcije.");
        return null;
      }
      return result.data;
    } catch (err) {
      console.error("Greška pri dobijanju tokena:", err);
      alert("Ne mogu da dobijem token za video.");
      return null;
    }
  }

  // 5️⃣ Pokretanje VdoPlayer-a
  async function playVideo() {
    const videoId = "f52a21250cb44ed990a0ecd9c910ca0b"; // Tvoj VdoCipher videoId

    // Proveri da li je korisnik prijavljen
    let user = auth.currentUser;
    if (!user) {
      user = await loginTestUser();
      if (!user) return;
    }

    const tokenData = await getToken(videoId);
    if (!tokenData) return;

    const container = document.getElementById("vdo-player");
    if (!container) {
      alert("Container za video nije pronađen.");
      return;
    }

    // Cleanup prethodnog playera (ako postoji)
    container.innerHTML = "";

    // Pokreni video
    new VdoPlayer({
      otp: tokenData.otp,
      playbackInfo: tokenData.playbackInfo,
      theme: "9ae8bbe8dd964ddc9bdb932cca1cb59a"
    }).setup("#vdo-player");
  }

  // Sačekaj da DOM učita pre nego što postaviš event listener
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("play-btn").addEventListener("click", playVideo);
  });
</script>
<iframe src="https://player.vdocipher.com/v2/?otp=20160313versUSE3232gHY1JKlGQcI2RXT5uGCfFZGO1A8HmnfhJQ28IZNJrUn59&playbackInfo=eyJ2aWRlb0lkIjoiZjUyYTIxMjUwY2I0NGVkOTkwYTBlY2Q5YzkxMGNhMGIifQ==" style="border:0;height:360px;width:640px;max-width:100%" allowFullScreen="true" allow="encrypted-media"></iframe>


</body>
</html>
