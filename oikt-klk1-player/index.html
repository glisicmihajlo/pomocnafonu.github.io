    <script>
        // Logovanje vrednosti kada se kurs menja
        const lessonList = document.getElementById('lesson-list');
        const iframe = document.getElementById('video-player');

        lessonList.addEventListener('click', function(e) {
            if (e.target.tagName === 'LI') {
                // Ukloni active class sa svih
                lessonList.querySelectorAll('li').forEach(li => li.classList.remove('active'));
                e.target.classList.add('active');

                // Logovanje vrednosti pre nego što menjaš src iframe-a
                console.log('Kliknut je kurs:', e.target.textContent);  // Loguj naziv kursa
                console.log('Nova iframe URL:', e.target.dataset.iframe);  // Loguj URL koji se koristi za iframe

                // Promeni src iframe-a
                iframe.src = e.target.dataset.iframe;
            }
        });

        // Logovanje podataka iz sessionStorage i localStorage
        console.log('Session Storage:', sessionStorage.getItem('token'));  // Loguj token u sessionStorage
        console.log('Local Storage:', localStorage.getItem('user'));  // Loguj korisnika u localStorage

        // Prati promene u veličini ekrana i loguj vrednosti
        window.addEventListener('resize', function() {
            console.log('Trenutna širina ekrana:', window.innerWidth);
            console.log('Aktuelni iframe URL:', iframe.src);  // Loguj trenutni iframe URL
        });

        // Testiranje full screen
        iframe.addEventListener('click', function() {
            console.log('Iframe kliknut');
        });

        document.addEventListener('fullscreenchange', function() {
            console.log('Fullscreen promenjen');
        });
    </script>
