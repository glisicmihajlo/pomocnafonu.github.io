<!DOCTYPE html>
<html lang="sr">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registracija - Pomoć na Fonu</title>
  <style>
    /* Reset i osnovni stilovi */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #121212;
      color: #fff;
    }

    /* Kontejner forme */
    .register-container {
      background: #1e1e1e;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      transition: all 0.3s ease;
    }

    .register-container h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      color: #f5f5f5;
    }

    /* Input polja */
    .register-container input[type="email"],
    .register-container input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 20px;
      border: none;
      border-radius: 8px;
      background: #2c2c2c;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: background 0.3s;
    }

    .register-container input[type="email"]::placeholder,
    .register-container input[type="password"]::placeholder {
      color: #aaa;
    }

    .register-container input:focus {
      background: #3a3a3a;
    }

    /* Dugme */
    .register-container button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #4a90e2;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .register-container button:hover {
      background: #357ab8;
    }

    /* Linkovi */
    .register-container .links {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .register-container .links a {
      color: #4a90e2;
      text-decoration: none;
      transition: color 0.3s;
    }

    .register-container .links a:hover {
      color: #357ab8;
    }

    .register-container p {
      padding-top: 0.5rem;
    }

    /* Responzivnost */
    @media (max-width: 500px) {
      .register-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="register-container">
    <h2>Registracija</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Lozinka">
      <button id="registerBtn">Registruj se</button>
    <div class="links">
        <p id="errorMsg"></p>
        <p>Već imaš nalog? <a href="/login">Prijavi se</a></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCacNqpdT5RARz4gvtmwewULR2Xv-tqv6c",
      authDomain: "pomoc-na-fonu.firebaseapp.com",
      projectId: "pomoc-na-fonu",
      storageBucket: "pomoc-na-fonu.appspot.com",
      messagingSenderId: "947001381183",
      appId: "1:947001381183:web:11a68f03a52c6ebb2a038a",
      measurementId: "G-768582D9M9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const registerBtn = document.getElementById("registerBtn");
    const errorMsg = document.getElementById("errorMsg");

    // Regex dozvoljava oblik poput mg20240050@student.fon.bg.ac.rs
    const studentEmailRegex = /^[a-z]{2}\d{8}@student\.fon\.bg\.ac\.rs$/;

    registerBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      errorMsg.textContent = "";

      if (!email || !password) {
        errorMsg.textContent = "Popuni oba polja!";
        return;
      }

      // Provera studentskog emaila
      if (!studentEmailRegex.test(email)) {
        errorMsg.textContent = "Možeš se registrovati samo studentskim FON emailom!";
        return;
      }

      try {
        // Kreiranje naloga
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Kreiraj dokument u Firestore
        await setDoc(doc(db, "users", user.uid), {
          email: email,
          kursevi: []
        });

        // Redirekcija
        window.location.href = "/kursevi/";

      } catch (err) {
        if (err.code === "auth/email-already-in-use") {
          errorMsg.textContent = "Ovaj email je već registrovan.";
        } else if (err.code === "auth/weak-password") {
          errorMsg.textContent = "Lozinka mora biti duža od 6 karaktera.";
        } else if (err.code === "auth/invalid-email") {
          errorMsg.textContent = "Unet je nevalidan email.";
        } else {
          errorMsg.textContent = "Greška pri registraciji. Pokušaj ponovo.";
        }
      }
    });
  </script>

</body>
</html>
