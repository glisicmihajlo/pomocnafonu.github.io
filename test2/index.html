<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Pro - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="brand">
                    <div class="logo-icon"><i class="fas fa-code"></i></div>
                    <span>DevAcademy</span>
                </div>
                <div class="progress-card">
                    <div class="card-header">
                        <small>UKUPAN NAPREDAK</small>
                        <b id="percent-text">0%</b>
                    </div>
                    <div class="progress-track">
                        <div id="progress-fill"></div>
                    </div>
                </div>
            </div>

            <nav class="course-nav" id="course-accordion">
            </nav>
        </aside>

        <main class="content-area">
            <div class="player-wrapper">
                <div class="video-frame">
                    <video id="main-video" controls controlsList="nodownload">
                    <source src="" type="video/mp4">
                </video>
                </div>

                <div class="content-footer">
                    <div class="lesson-meta">
                        <span class="badge" id="module-tag">Modul</span>
                        <h1 id="lesson-title">Izaberite lekciju</h1>
                        <p id="lesson-desc">Vaš put ka uspehu počinje ovde. Izaberite video sa leve strane.</p>
                    </div>
                    <div class="actions">
                        <button id="btn-complete" class="btn-glow">
                        <i class="fas fa-check"></i> Mark as Complete
                    </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
